name: atolia-release-candidate

on:
  push:
    branches:
      - atolia-release-candidate-surgery
  pull_request:
    branches:
      - atolia-release-candidate-surgery

jobs:
  archaeology-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Atolia runtime and test runner
        run: |
          python -m pip install -r requirements-atolia.txt
          python -m pip install pytest
      - name: Compile current archaeology runtime
        run: python -m compileall -q src/atolia generate_player_game.py
      - name: Release invariants
        env:
          PYTHONPATH: src/atolia
        run: python -m pytest -q src/atolia/tests/test_release_candidate_invariants.py
      - name: Acquisition campaign regressions
        env:
          PYTHONPATH: src/atolia
        run: python -m pytest -q src/atolia/tests/test_acquisition_campaign.py src/atolia/tests/test_transport_fields.py
      - name: Cache/bootstrap CLI surface
        run: |
          python generate_player_game.py --help | grep -- '--substrate'
          python generate_player_game.py --help | grep -- '--allow-slow-build'

name: Atolia v3 phase-08 empirical runtime gate

on:
  push:
    branches:
      - atolia-v3-08-runtime-compression
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atolia-v3-phase08-unit
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase-08 branch
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt pytest
      - name: Compile Phase-08 projection
        run: |
          python -m py_compile \
            src/atolia/v3_phase08_runtime_fragment.py \
            src/atolia/v3_phase08_extract_shard.py
      - name: Test empirical runtime projection
        run: |
          pytest -q \
            tests/test_v3_phase08_runtime_fragment.py \
            tests/test_v3_phase07_repair.py \
            tests/test_v3_phase07_replay_capsule.py

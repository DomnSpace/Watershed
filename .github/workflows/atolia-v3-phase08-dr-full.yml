name: Atolia v3 Phase-08 full Dr. Corrosion extraction

on:
  push:
    branches:
      - atolia-v3-08-dr-corrosion-extract
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atolia-v3-phase08-dr-full
  cancel-in-progress: false

env:
  CANONICAL_MEND_RUN_ID: "33623991317"

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dr-extract-full]')
    runs-on: ubuntu-24.04
    outputs:
      wave1: ${{ steps.matrix.outputs.wave1 }}
      wave2: ${{ steps.matrix.outputs.wave2 }}
      wave3: ${{ steps.matrix.outputs.wave3 }}
    steps:
      - name: Build three bounded extraction waves
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          capsule = {507, 508, 515, 516, 564, 565, 568, 569, 577}
          waves = {
              'wave1': range(0, 200),
              'wave2': range(200, 400),
              'wave3': range(400, 580),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for name, ordinals in waves.items():
                  rows = [{'ordinal': i, 'capsule': i in capsule} for i in ordinals]
                  handle.write(name + '=' + json.dumps(rows, separators=(',', ':')) + '\n')
          PY

      - name: Download successful Phase-07 mend provenance
        uses: actions/download-artifact@v4
        with:
          name: atolia-v3-phase07-canonical-mend
          path: /tmp/mend
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANONICAL_MEND_RUN_ID }}

      - name: Freeze repair certificate for all extraction workers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CERTS < <(find /tmp/mend -type f -name 'repair-certificate.json' -print)
          test "${#CERTS[@]}" -eq 1
          mkdir -p /tmp/input
          cp "${CERTS[0]}" /tmp/input/repair-certificate.json

      - name: Upload compact worker input
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-phase08-dr-repair-certificate
          path: /tmp/input/repair-certificate.json
          compression-level: 6
          retention-days: 7
          if-no-files-found: error

  wave1:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.wave1) }}
    uses: ./.github/workflows/atolia-v3-phase08-dr-worker.yml
    with:
      ordinal: ${{ matrix.item.ordinal }}
      capsule: ${{ matrix.item.capsule }}

  wave2:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.wave2) }}
    uses: ./.github/workflows/atolia-v3-phase08-dr-worker.yml
    with:
      ordinal: ${{ matrix.item.ordinal }}
      capsule: ${{ matrix.item.capsule }}

  wave3:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.wave3) }}
    uses: ./.github/workflows/atolia-v3-phase08-dr-worker.yml
    with:
      ordinal: ${{ matrix.item.ordinal }}
      capsule: ${{ matrix.item.capsule }}

  reduce:
    needs: [wave1, wave2, wave3]
    if: ${{ always() && needs.wave1.result == 'success' && needs.wave2.result == 'success' && needs.wave3.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all 580 compact fragments only
        uses: actions/download-artifact@v4
        with:
          pattern: atolia-v3-phase08-dr-fragment-*
          path: /tmp/fragments
          merge-multiple: true

      - name: Assemble contiguous sampler root and stdlib archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python src/atolia/v3_phase08_assemble_compact.py \
            --fragments /tmp/fragments \
            --index /tmp/final/atolia_v3_phase08_index.json.gz \
            --archive /tmp/final/atolia_v3_phase08_sampler.zip \
            --expected-shards 580

      - name: Write final extraction summary
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          index = Path('/tmp/final/atolia_v3_phase08_index.json.gz')
          archive = Path('/tmp/final/atolia_v3_phase08_sampler.zip')
          root = json.loads(gzip.decompress(index.read_bytes()))
          assert root['shard_count'] == 580
          assert root['global_cell_start'] == 0
          assert root['global_cell_stop'] == 37100
          assert root['counts']['cells'] == 37100
          assert sum(row['capsule_backed'] for row in root['shards']) == 9
          summary = {
              'schema': 'atolia-v3-phase08-dr-extraction-summary-v1',
              'world_build_id': root['world_build_id'],
              'root_sha256': root['root_sha256'],
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'archive_bytes': archive.stat().st_size,
              'index_bytes': index.stat().st_size,
              'shards': root['shard_count'],
              'counts': root['counts'],
              'totals': root['totals'],
          }
          Path('/tmp/final/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload durable Phase-08 Dr. Corrosion substrate
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-phase08-dr-substrate
          path: |
            /tmp/final/atolia_v3_phase08_index.json.gz
            /tmp/final/atolia_v3_phase08_sampler.zip
            /tmp/final/summary.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

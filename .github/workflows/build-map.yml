name: Build Europe watershed outlet map

on:
  workflow_dispatch:
    inputs:
      hydrobasins_level:
        description: "HydroBASINS level: 5 fast, 6 good poster default, 7 finer/slower"
        required: true
        default: "6"
      channel_as:
        description: "Classify English Channel terminal basins as Atlantic Europe or North Sea Europe"
        required: true
        default: "Atlantic Europe"
        type: choice
        options:
          - Atlantic Europe
          - North Sea Europe
      drop_other:
        description: "Drop Caspian / Other diagnostic layer"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build map
        run: |
          FLAGS=""
          if [ "${{ inputs.drop_other }}" = "true" ]; then FLAGS="--drop-other"; fi
          python src/make_europe_watershed_map.py \
            --level "${{ inputs.hydrobasins_level }}" \
            --channel-as "${{ inputs.channel_as }}" \
            $FLAGS

      - name: Upload map artifacts
        uses: actions/upload-artifact@v4
        with:
          name: europe-watershed-map
          path: |
            out/europe_watershed_common_outlets.png
            out/europe_watershed_common_outlets.svg
            out/europe_watershed_outlet_regions.gpkg
            out/basin_classification_table.csv
          if-no-files-found: error

name: Atolia v3 Phase-08 Dr. Corrosion extraction

on:
  push:
    branches:
      - atolia-v3-08-dr-corrosion-extract
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atolia-v3-phase08-dr-extract
  cancel-in-progress: false

env:
  SOURCE_SHARD_RUN_ID: "33305458675"
  CANONICAL_MEND_RUN_ID: "33623991317"
  REPLAY_RUN_ID: "33621402837"

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt pytest
      - name: Compile compact extractor
        run: |
          python -m py_compile \
            src/atolia/v3_phase08_runtime_fragment.py \
            src/atolia/v3_phase08_extract_shard.py \
            src/atolia/v3_phase08_compact_fragment.py
      - name: Unit and mend boundary tests
        run: |
          pytest -q \
            tests/test_v3_phase08_runtime_fragment.py \
            tests/test_v3_phase08_compact_fragment.py \
            tests/test_v3_phase07_repair.py \
            tests/test_v3_phase07_replay_capsule.py

  canary:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dr-extract-canary]')
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - ordinal: 2
            capsule: false
            expected_action: RETAIN_CANONICAL_SOURCE
          - ordinal: 507
            capsule: true
            expected_action: PROJECT_MINORITY_TO_CANONICAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt

      - name: Download immutable Phase-07 source shard
        uses: actions/download-artifact@v4
        with:
          name: atolia-v3-canonical-shard-${{ matrix.ordinal }}
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_SHARD_RUN_ID }}

      - name: Download canonical mend certificate
        uses: actions/download-artifact@v4
        with:
          name: atolia-v3-phase07-canonical-mend
          path: /tmp/mend
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANONICAL_MEND_RUN_ID }}

      - name: Download exact replay capsule
        if: matrix.capsule
        uses: actions/download-artifact@v4
        with:
          name: phase07-replay-capsule-${{ matrix.ordinal }}
          path: /tmp/capsule
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPLAY_RUN_ID }}

      - name: Compact real mended shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SHARDS < <(find /tmp/source -type f -name '*.nc' -print)
          mapfile -t CERTS < <(find /tmp/mend -type f -name 'repair-certificate.json' -print)
          test "${#SHARDS[@]}" -eq 1
          test "${#CERTS[@]}" -eq 1
          mkdir -p /tmp/out
          ARGS=(
            --shard "${SHARDS[0]}"
            --certificate "${CERTS[0]}"
            --ordinal '${{ matrix.ordinal }}'
            --representatives-per-profile 2
            --out '/tmp/out/compact-${{ matrix.ordinal }}.json.gz'
          )
          if [ '${{ matrix.capsule }}' = 'true' ]; then
            mapfile -t CAPS < <(find /tmp/capsule -type f -name 'replay-${{ matrix.ordinal }}.json' -print)
            test "${#CAPS[@]}" -eq 1
            ARGS+=(--capsule "${CAPS[0]}")
          fi
          python src/atolia/v3_phase08_compact_fragment.py "${ARGS[@]}"

      - name: Validate compact canary and report compression
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          ordinal = int('${{ matrix.ordinal }}')
          source = next(Path('/tmp/source').rglob('*.nc'))
          out = Path(f'/tmp/out/compact-{ordinal}.json.gz')
          row = json.loads(gzip.decompress(out.read_bytes()))
          assert row['schema'] == 'atolia-v3-phase08-compact-sampler-fragment-v1'
          assert row['chunk_ordinal'] == ordinal
          assert row['recovery']['action'] == '${{ matrix.expected_action }}'
          assert row['counts']['cells'] > 0
          assert row['counts']['lineages'] > row['counts']['profiles']
          assert row['counts']['representatives'] <= 2 * row['counts']['profiles']
          assert row['counts']['external_tails'] >= 0
          assert row['totals']['represented_weight'] > 0
          assert row['totals']['recorded_weight'] > 0
          if ordinal == 507:
              assert row['recovery']['replay_capsule_sha256']
          summary = {
              'ordinal': ordinal,
              'source_bytes': source.stat().st_size,
              'compact_bytes': out.stat().st_size,
              'compression_ratio': source.stat().st_size / out.stat().st_size,
              **row['counts'],
              **row['totals'],
          }
          Path(f'/tmp/out/summary-{ordinal}.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Remove physical source copy
        if: always()
        run: rm -rf /tmp/source

      - name: Upload compact canary
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-dr-extract-canary-${{ matrix.ordinal }}
          path: |
            /tmp/out/compact-${{ matrix.ordinal }}.json.gz
            /tmp/out/summary-${{ matrix.ordinal }}.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

name: Atolia provenance and procedural career

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Canonical/reference artifact manifest path
        required: false
        default: catalogues/archaeometallurgy_300_v0.txt
      seed:
        description: Master procedural career seed
        required: false
        default: '1300'
      player_key:
        description: Opaque player key for player-package build
        required: false
        default: actions-test-player
  push:
    branches: [atolia-copper-200kt-v0]
    paths:
      - 'src/atolia/**'
      - 'catalogues/**'
      - 'hypotheses/**'
      - 'generate_player_game.py'
      - 'serve_player_game.py'
      - 'atolia_game_generator.json'
      - 'requirements-atolia.txt'
      - 'tests/test_atolia_*.py'
      - '.github/workflows/atolia-provenance.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Atolia provenance, procedural and POARI tests
        run: |
          pytest -q \
            tests/test_atolia_provenance.py \
            tests/test_atolia_provenance_mediterranean.py \
            tests/test_atolia_artifact_manifest.py \
            tests/test_atolia_manifest_distribution.py \
            tests/test_atolia_procedural_sampler.py \
            tests/test_atolia_poari_router.py

      - name: Resolve build inputs
        id: inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manifest=${{ inputs.manifest }}" >> "$GITHUB_OUTPUT"
            echo "seed=${{ inputs.seed }}" >> "$GITHUB_OUTPUT"
            echo "player_key=${{ inputs.player_key }}" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=catalogues/archaeometallurgy_300_v0.txt" >> "$GITHUB_OUTPUT"
            echo "seed=1300" >> "$GITHUB_OUTPUT"
            echo "player_key=actions-test-player" >> "$GITHUB_OUTPUT"
          fi

      - name: Build canonical manifest regression dataset
        run: |
          python src/atolia/build_manifest_dataset.py \
            --manifest "${{ steps.inputs.outputs.manifest }}" \
            --seed "${{ steps.inputs.outputs.seed }}" \
            --workshops 1200 \
            --catalogue-cap 15000 \
            --out-dir out/canonical_manifest_regression

      - name: Build POARI-routed player package
        run: |
          python generate_player_game.py \
            "${{ steps.inputs.outputs.player_key }}" \
            --workshops 1600 \
            --catalogue-cap 18000 \
            --out out/player_game.json

      - name: Assert player package contains no developer truth keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [Path('out/canonical_manifest_regression/player')]
          texts = [Path('out/player_game.json').read_text()]
          texts += [p.read_text() for root in roots for p in root.glob('*') if p.is_file()]
          text = '\n'.join(texts)
          forbidden = [
              'target_tonnes', 'bundle_id', 'bundle_family', 'source_mix',
              'workshop_id', 'lineage_id', 'guild_id', 'guild_strength',
              'guild_events', 'guild_affinity_vector', 'guild_event_vector',
              'route', 'recycle_fraction', 'bronze_network_coupling',
              'spoiler_score', 'network_information', 'route_trace',
          ]
          leaked = [key for key in forbidden if f'"{key}"' in text]
          if leaked:
              raise SystemExit(f'Hidden truth leaked into player export: {leaked}')
          PY

      - name: Upload POARI player package
        uses: actions/upload-artifact@v4
        with:
          name: dr-corrosion-player-game
          path: out/player_game.json
          retention-days: 14

      - name: Upload canonical regression build
        uses: actions/upload-artifact@v4
        with:
          name: atolia-canonical-manifest-${{ steps.inputs.outputs.seed }}
          path: out/canonical_manifest_regression
          retention-days: 14

name: Atolia provenance manifest

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Artifact manifest path
        required: false
        default: catalogues/archaeometallurgy_300_v0.txt
      seed:
        description: Monte Carlo seed
        required: false
        default: '1300'
  push:
    branches: [atolia-copper-200kt-v0]
    paths:
      - 'src/atolia/**'
      - 'catalogues/**'
      - 'hypotheses/**'
      - 'tests/test_atolia_*.py'
      - '.github/workflows/atolia-provenance.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run provenance tests
        run: |
          pytest -q \
            tests/test_atolia_provenance.py \
            tests/test_atolia_provenance_mediterranean.py \
            tests/test_atolia_artifact_manifest.py \
            tests/test_atolia_manifest_distribution.py

      - name: Resolve build inputs
        id: inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manifest=${{ inputs.manifest }}" >> "$GITHUB_OUTPUT"
            echo "seed=${{ inputs.seed }}" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=catalogues/archaeometallurgy_300_v0.txt" >> "$GITHUB_OUTPUT"
            echo "seed=1300" >> "$GITHUB_OUTPUT"
          fi

      - name: Build player-safe artifact dataset
        run: |
          python src/atolia/build_manifest_dataset.py \
            --manifest "${{ steps.inputs.outputs.manifest }}" \
            --seed "${{ steps.inputs.outputs.seed }}" \
            --workshops 1600 \
            --catalogue-cap 18000 \
            --out-dir out/atolia_artifacts_v0

      - name: Assert player export contains no developer truth keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = '\n'.join(p.read_text() for p in Path('out/atolia_artifacts_v0/player').glob('*') if p.is_file())
          forbidden = [
              'target_tonnes', 'bundle_id', 'bundle_family', 'source_mix',
              'workshop_id', 'lineage_id', 'guild_id', 'guild_strength',
              'route', 'recycle_fraction', 'bronze_network_coupling',
          ]
          leaked = [key for key in forbidden if f'"{key}"' in text]
          if leaked:
              raise SystemExit(f'Hidden truth leaked into player export: {leaked}')
          PY

      - name: Upload generated provenance dataset
        uses: actions/upload-artifact@v4
        with:
          name: atolia-artifacts-${{ steps.inputs.outputs.seed }}
          path: out/atolia_artifacts_v0
          retention-days: 14

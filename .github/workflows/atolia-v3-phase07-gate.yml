name: Atolia v3 phase-07 gate

on:
  push:
    branches:
      - atolia-v3-07-canonical-full
  workflow_dispatch:

jobs:
  g2-g8:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt pytest

      - name: Phase 07 canonical shard unit and resume gate
        run: pytest -q tests/test_v3_phase07_canonical.py

      - name: Direct phase-07 three-shard verification prefix
        run: |
          python src/atolia/v3_phase07_canonical.py \
            --world-seed 1300 \
            --workshops 320 \
            --steps 2 \
            --nodes 12 \
            --chunk-cells 64 \
            --max-cells 192 \
            --out-dir /tmp/atolia_v3_phase07_verify

      - name: Phase 06 stratification regression
        run: pytest -q tests/test_v3_medium_stratified.py

      - name: Phase 05 hydro-exchange-deposition regression
        run: pytest -q tests/test_v3_hydro_exchange_deposition.py

      - name: Phase 04 workshop-guild-tool regression
        run: pytest -q tests/test_v3_workshop_ecology.py tests/test_v3_workshop_hash_policy.py

      - name: Phase 03 source-metallurgy regression
        run: pytest -q tests/test_v3_source_metallurgy.py

      - name: Phase 02 metal-biography regression
        run: pytest -q tests/test_v3_metal_biography.py

      - name: Phase 01 exact spine regression
        run: pytest -q tests/test_v3_v1_spine_equivalence.py

  canonical-full:
    if: contains(github.event.head_commit.message, '[canonical-full-run]')
    needs: g2-g8
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt

      - name: Build canonical full v3 world
        run: |
          python src/atolia/v3_phase07_canonical.py \
            --chunk-cells 512 \
            --out-dir /tmp/atolia_v3_canonical_full \
            | tee /tmp/atolia_v3_canonical_full_summary.json

      - name: Validate canonical manifest
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src/atolia')
          import v3_phase07_manifest as m
          x = m.read_manifest('/tmp/atolia_v3_canonical_full/manifest.nc')
          assert x['product_scope'] == 'canonical-full'
          assert x['config']['materialized_cells'] == x['config']['population_cells']
          print(x['world_build_id'])
          print(x['phase07_manifest_sha256'])
          print(x['totals'])
          PY

      - name: Upload canonical full master set
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-full
          path: |
            /tmp/atolia_v3_canonical_full
            /tmp/atolia_v3_canonical_full_summary.json
          compression-level: 0
          retention-days: 7

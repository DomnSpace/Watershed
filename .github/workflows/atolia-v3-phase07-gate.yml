name: Atolia v3 phase-07 gate

on:
  push:
    branches:
      - atolia-v3-07-canonical-full
  workflow_dispatch:

jobs:
  g2-g8:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt pytest

      - name: Phase 07 canonical shard unit and resume gate
        run: pytest -q tests/test_v3_phase07_canonical.py tests/test_v3_phase07_durable.py

      - name: Direct phase-07 three-shard verification prefix
        run: |
          python src/atolia/v3_phase07_canonical.py \
            --world-seed 1300 \
            --workshops 320 \
            --steps 2 \
            --nodes 12 \
            --chunk-cells 64 \
            --max-cells 192 \
            --out-dir /tmp/atolia_v3_phase07_verify

      - name: Phase 06 stratification regression
        run: pytest -q tests/test_v3_medium_stratified.py

      - name: Phase 05 hydro-exchange-deposition regression
        run: pytest -q tests/test_v3_hydro_exchange_deposition.py

      - name: Phase 04 workshop-guild-tool regression
        run: pytest -q tests/test_v3_workshop_ecology.py tests/test_v3_workshop_hash_policy.py

      - name: Phase 03 source-metallurgy regression
        run: pytest -q tests/test_v3_source_metallurgy.py

      - name: Phase 02 metal-biography regression
        run: pytest -q tests/test_v3_metal_biography.py

      - name: Phase 01 exact spine regression
        run: pytest -q tests/test_v3_v1_spine_equivalence.py

  durable-plan:
    if: contains(github.event.head_commit.message, '[canonical-durable-run]')
    needs: g2-g8
    runs-on: ubuntu-24.04
    outputs:
      canary: ${{ steps.plan.outputs.canary }}
      wave0: ${{ steps.plan.outputs.wave0 }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
    steps:
      - id: plan
        name: Plan 580 durable 64-cell shards in nested waves
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          population = 37100
          chunk = 64
          rows = []
          for ordinal, start in enumerate(range(0, population, chunk)):
              stop = min(population, start + chunk)
              rows.append({"ordinal": ordinal, "start": start, "stop": stop})
          assert len(rows) == 580
          parts = {
              "canary": rows[:3],
              "wave0": rows[3:195],
              "wave1": rows[195:387],
              "wave2": rows[387:],
          }
          assert [len(parts[k]) for k in ("canary", "wave0", "wave1", "wave2")] == [3, 192, 192, 193]
          assert sum(len(v) for v in parts.values()) == len(rows)
          for name, part in parts.items():
              print(name + "=" + json.dumps({"include": part}, separators=(",", ":")))
          PY

  durable-canary:
    if: needs.durable-plan.result == 'success'
    needs: [g2-g8, durable-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.durable-plan.outputs.canary) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt

      - name: Build immutable canonical canary shard
        run: |
          mkdir -p /tmp/atolia_v3_shard
          python src/atolia/v3_phase07_shard.py \
            --start ${{ matrix.start }} \
            --stop ${{ matrix.stop }} \
            --chunk-cells 64 \
            --expected-population 37100 \
            --out-dir /tmp/atolia_v3_shard \
            | tee /tmp/atolia_v3_shard/worker-${{ matrix.ordinal }}.json

      - name: Upload manifest fragment immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-fragment-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard/*.fragment.json
          compression-level: 6
          retention-days: 90
          if-no-files-found: error

      - name: Upload canary shard immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-shard-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  durable-wave0:
    if: ${{ always() && needs.g2-g8.result == 'success' && needs.durable-plan.result == 'success' && needs.durable-canary.result == 'success' }}
    needs: [g2-g8, durable-plan, durable-canary]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.durable-plan.outputs.wave0) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt
      - name: Build immutable canonical shard
        run: |
          mkdir -p /tmp/atolia_v3_shard
          python src/atolia/v3_phase07_shard.py \
            --start ${{ matrix.start }} \
            --stop ${{ matrix.stop }} \
            --chunk-cells 64 \
            --expected-population 37100 \
            --out-dir /tmp/atolia_v3_shard \
            | tee /tmp/atolia_v3_shard/worker-${{ matrix.ordinal }}.json
      - name: Upload manifest fragment immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-fragment-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard/*.fragment.json
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
      - name: Upload shard immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-shard-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  durable-wave1:
    if: ${{ always() && needs.g2-g8.result == 'success' && needs.durable-plan.result == 'success' && needs.durable-canary.result == 'success' }}
    needs: [g2-g8, durable-plan, durable-canary, durable-wave0]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.durable-plan.outputs.wave1) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt
      - name: Build immutable canonical shard
        run: |
          mkdir -p /tmp/atolia_v3_shard
          python src/atolia/v3_phase07_shard.py \
            --start ${{ matrix.start }} \
            --stop ${{ matrix.stop }} \
            --chunk-cells 64 \
            --expected-population 37100 \
            --out-dir /tmp/atolia_v3_shard \
            | tee /tmp/atolia_v3_shard/worker-${{ matrix.ordinal }}.json
      - name: Upload manifest fragment immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-fragment-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard/*.fragment.json
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
      - name: Upload shard immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-shard-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  durable-wave2:
    if: ${{ always() && needs.g2-g8.result == 'success' && needs.durable-plan.result == 'success' && needs.durable-canary.result == 'success' }}
    needs: [g2-g8, durable-plan, durable-canary, durable-wave0, durable-wave1]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.durable-plan.outputs.wave2) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt
      - name: Build immutable canonical shard
        run: |
          mkdir -p /tmp/atolia_v3_shard
          python src/atolia/v3_phase07_shard.py \
            --start ${{ matrix.start }} \
            --stop ${{ matrix.stop }} \
            --chunk-cells 64 \
            --expected-population 37100 \
            --out-dir /tmp/atolia_v3_shard \
            | tee /tmp/atolia_v3_shard/worker-${{ matrix.ordinal }}.json
      - name: Upload manifest fragment immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-fragment-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard/*.fragment.json
          compression-level: 6
          retention-days: 90
          if-no-files-found: error
      - name: Upload shard immediately
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-shard-${{ matrix.ordinal }}
          path: /tmp/atolia_v3_shard
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  durable-manifest:
    if: ${{ always() && needs.durable-canary.result == 'success' && needs.durable-wave0.result == 'success' && needs.durable-wave1.result == 'success' && needs.durable-wave2.result == 'success' }}
    needs: [durable-plan, durable-canary, durable-wave0, durable-wave1, durable-wave2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt

      - name: Download compact validated fragments only
        uses: actions/download-artifact@v4
        with:
          pattern: atolia-v3-canonical-fragment-*
          path: /tmp/atolia_v3_fragments
          merge-multiple: true

      - name: Assemble canonical manifest from fragments
        run: |
          mkdir -p /tmp/atolia_v3_manifest
          python src/atolia/v3_phase07_assemble_fragments.py \
            --fragment-dir /tmp/atolia_v3_fragments \
            --out /tmp/atolia_v3_manifest/manifest.nc \
            --population-cells 37100 \
            --chunk-cells 64 \
            | tee /tmp/atolia_v3_manifest/summary.json

      - name: Validate canonical manifest
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'src/atolia')
          import v3_phase07_manifest as m
          x = m.read_manifest('/tmp/atolia_v3_manifest/manifest.nc')
          assert x['product_scope'] == 'canonical-full'
          assert x['config']['population_cells'] == 37100
          assert x['config']['materialized_cells'] == 37100
          assert len(x['shards']) == 580
          assert x['shards'][0]['global_cell_start'] == 0
          assert x['shards'][-1]['global_cell_stop'] == 37100
          print(x['world_build_id'])
          print(x['phase07_manifest_sha256'])
          print(x['totals'])
          PY

      - name: Upload canonical root manifest
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-canonical-manifest
          path: /tmp/atolia_v3_manifest
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

name: Build and publish watershed web map

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which data target to build'
        required: true
        default: 'both'
        type: choice
        options:
          - world
          - europe
          - both
  push:
    branches: [main, global-watershed]
    paths:
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache geospatial downloads
        uses: actions/cache@v4
        with:
          path: data
          key: geodata-${{ runner.os }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            geodata-${{ runner.os }}-

      - name: Decide build target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "global-watershed" ]; then
            echo "target=both" >> "$GITHUB_OUTPUT"
          else
            echo "target=europe" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Europe tab data
        if: steps.target.outputs.target == 'europe' || steps.target.outputs.target == 'both'
        run: python src/build_europe_data.py

      - name: Build World tab data
        if: steps.target.outputs.target == 'world' || steps.target.outputs.target == 'both'
        run: python src/global/build_global.py

      - name: Build tabbed site shell
        run: python src/build_site_index.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

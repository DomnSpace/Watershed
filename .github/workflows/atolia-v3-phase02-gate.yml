name: Atolia v3 phase-02 gate

on:
  push:
    branches:
      - atolia-v3-02-metal-biography
  workflow_dispatch:

jobs:
  g2-g3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused Atolia dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt pytest

      - name: Phase 02 metal-biography gate
        run: pytest -q tests/test_v3_metal_biography.py

      - name: Phase 01 exact spine regression
        run: pytest -q tests/test_v3_v1_spine_equivalence.py

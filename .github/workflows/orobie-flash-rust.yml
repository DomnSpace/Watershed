name: Orobie Flash Windows runner
on:
  push:
    branches:
      - feat/orobie-flash-flood-rust
    paths:
      - 'demos/orobie-flash/**'
      - '.github/workflows/orobie-flash-rust.yml'
  workflow_dispatch:

jobs:
  validate_dem_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster prep dependencies
        run: python -m pip install numpy rasterio pyproj
      - name: Test georeferencing mosaic and lossless provenance boundaries
        working-directory: demos/orobie-flash
        run: python tools/test_regions.py
  build_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demos/orobie-flash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demos/orobie-flash
      - name: Unit tests
        run: cargo test --release
      - name: Build portable EXE
        run: cargo build --release
      - name: Assemble one-click sample
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/orobie_flash.exe dist/orobie_flash.exe
          Copy-Item README.md dist/README.md
          New-Item -ItemType Directory -Force -Path dist/data | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: OROBIE-FLASH-windows-x64
          path: demos/orobie-flash/dist/

name: Atolia v3 phase-07 hydro cutoff forensics

on:
  push:
    branches:
      - atolia-v3-07-hydro-forensics
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atolia-v3-phase07-hydro-forensics
  cancel-in-progress: false

env:
  HYDRO_COMPARE_RUN_ID: "33395627164"

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase07-hydro-forensics]') }}
    runs-on: ubuntu-24.04
    outputs:
      replicas: ${{ steps.matrix.outputs.replicas }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("replicas=" + json.dumps({"include": [{"replica": i} for i in range(32)]}, separators=(",", ":")))
          PY

  sample:
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.replicas) }}
    steps:
      - name: Checkout forensic branch
        uses: actions/checkout@v4

      - name: Python 3.12 exactly as source run
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exactly the source-run Atolia dependency constraint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atolia.txt

      - name: Rebuild only geography and the hydro candidate cutoff
        run: |
          mkdir -p /tmp/phase07_hydro_forensics
          python src/atolia/v3_phase07_hydro_forensics.py \
            --replica "${{ matrix.replica }}" \
            --out "/tmp/phase07_hydro_forensics/replica-${{ matrix.replica }}.json"

      - name: Upload raw forensic trace
        uses: actions/upload-artifact@v4
        with:
          name: phase07-hydro-forensics-${{ matrix.replica }}
          path: /tmp/phase07_hydro_forensics/replica-${{ matrix.replica }}.json
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

  aggregate:
    needs: sample
    if: always() && needs.sample.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download all 32 runner traces
        uses: actions/download-artifact@v6
        with:
          pattern: phase07-hydro-forensics-*
          path: /tmp/phase07_hydro_forensics
          merge-multiple: true

      - name: Download the two immutable source-run hydro witnesses
        uses: actions/download-artifact@v6
        with:
          pattern: phase07-hydro-snapshot-*
          path: /tmp/phase07_source_hydro
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HYDRO_COMPARE_RUN_ID }}

      - name: Classify replicas against the original bifurcation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          import hashlib
          import json

          def stable(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), allow_nan=False)
          def sha(value):
              return hashlib.sha256(stable(value).encode('utf-8')).hexdigest()
          def provisional_pairs(snapshot):
              return sorted(
                  [str(r['a']), str(r['b'])]
                  for r in snapshot['hydro_ensemble']
                  if not bool(r['structural'])
              )

          report_paths = sorted(Path('/tmp/phase07_hydro_forensics').glob('replica-*.json'))
          if len(report_paths) != 32:
              raise RuntimeError(f'expected 32 forensic reports, found {len(report_paths)}')
          reports = [json.loads(path.read_text(encoding='utf-8')) for path in report_paths]
          reports.sort(key=lambda r: int(r['environment']['replica']))

          snapshot_paths = sorted(Path('/tmp/phase07_source_hydro').glob('hydro-*.json'))
          if len(snapshot_paths) != 2:
              raise RuntimeError(f'expected two source hydro witnesses, found {len(snapshot_paths)}')
          snapshots = [json.loads(path.read_text(encoding='utf-8')) for path in snapshot_paths]
          snapshots.sort(key=lambda r: int(r['chunk_ordinal']))

          source_variants = []
          source_by_hash = {}
          source_pair_sets = []
          for snap in snapshots:
              pairs = provisional_pairs(snap)
              pair_hash = sha(pairs)
              row = {
                  'chunk_ordinal': int(snap['chunk_ordinal']),
                  'world_build_id': str(snap['world_build_id']),
                  'selected_provisional_pair_sha256': pair_hash,
                  'selected_provisional_pair_count': len(pairs),
              }
              source_variants.append(row)
              source_by_hash[pair_hash] = f"source-ordinal-{row['chunk_ordinal']}"
              source_pair_sets.append({tuple(p) for p in pairs})

          only_0 = sorted(source_pair_sets[0] - source_pair_sets[1])
          only_1 = sorted(source_pair_sets[1] - source_pair_sets[0])
          observed_boundary = sorted(set(only_0) | set(only_1))

          classifications = []
          by_selection = Counter()
          by_source_class = Counter()
          by_cpu = Counter()
          by_numpy = Counter()
          by_cutoff_hex = Counter()
          boundary_rows = []

          for report in reports:
              env = report['environment']
              hydro = report['hydro']
              pair_hash = str(hydro['selected_provisional_pair_sha256'])
              source_class = source_by_hash.get(pair_hash, 'novel-selection')
              cpu_model = str(env.get('cpu', {}).get('model'))
              numpy_version = str(env.get('numpy_version'))
              cutoff_hex = str(hydro['cutoff_score']['hex'])
              by_selection[pair_hash] += 1
              by_source_class[source_class] += 1
              by_cpu[(source_class, cpu_model)] += 1
              by_numpy[(source_class, numpy_version)] += 1
              by_cutoff_hex[(source_class, cutoff_hex)] += 1
              classifications.append({
                  'replica': int(env['replica']),
                  'source_class': source_class,
                  'selected_provisional_pair_sha256': pair_hash,
                  'cpu_model': cpu_model,
                  'numpy_version': numpy_version,
                  'cutoff_score_hex': cutoff_hex,
                  'image_os': env.get('image_os'),
                  'image_version': env.get('image_version'),
              })

              wanted = set(observed_boundary)
              for row in hydro['levant_nile_corridor_candidates']:
                  pair = (str(row['a']), str(row['b']))
                  if pair in wanted:
                      boundary_rows.append({
                          'replica': int(env['replica']),
                          'source_class': source_class,
                          'a': pair[0],
                          'b': pair[1],
                          'rank': int(row['rank']),
                          'selected': bool(row['selected']),
                          'distance_hex': str(row['distance_km']['hex']),
                          'probability_hex': str(row['probability']['hex']),
                          'navigability_hex': str(row['navigability']['hex']),
                          'score_hex': str(row['score']['hex']),
                          'score_bit_delta_from_cutoff': int(row['score_bit_delta_from_cutoff']),
                          'a_lon_hex': str(row['a_node']['lon']['hex']),
                          'a_lat_hex': str(row['a_node']['lat']['hex']),
                          'b_lon_hex': str(row['b_node']['lon']['hex']),
                          'b_lat_hex': str(row['b_node']['lat']['hex']),
                      })

          def counter_rows(counter, names):
              out = []
              for key, count in sorted(counter.items(), key=lambda kv: (-kv[1], str(kv[0]))):
                  keys = key if isinstance(key, tuple) else (key,)
                  out.append({**dict(zip(names, keys)), 'count': int(count)})
              return out

          summary = {
              'schema': 'atolia-v3-phase07-hydro-cutoff-forensics-summary-v1',
              'replica_count': len(reports),
              'source_variants': source_variants,
              'source_symmetric_difference': {
                  'only_first_source': [list(p) for p in only_0],
                  'only_second_source': [list(p) for p in only_1],
                  'total_boundary_pairs': len(observed_boundary),
              },
              'selection_variant_count': len(by_selection),
              'selection_counts': counter_rows(by_selection, ['selected_provisional_pair_sha256']),
              'source_class_counts': counter_rows(by_source_class, ['source_class']),
              'cpu_class_counts': counter_rows(by_cpu, ['source_class', 'cpu_model']),
              'numpy_class_counts': counter_rows(by_numpy, ['source_class', 'numpy_version']),
              'cutoff_hex_class_counts': counter_rows(by_cutoff_hex, ['source_class', 'cutoff_score_hex']),
              'classifications': classifications,
              'observed_boundary_candidate_rows': boundary_rows,
              'reproduced_original_bifurcation': all(v in by_source_class for v in source_by_hash.values()),
              'novel_selection_count': int(by_source_class.get('novel-selection', 0)),
          }
          out = Path('/tmp/phase07_hydro_forensics_summary.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'replica_count': summary['replica_count'],
              'selection_variant_count': summary['selection_variant_count'],
              'source_class_counts': summary['source_class_counts'],
              'cpu_class_counts': summary['cpu_class_counts'],
              'numpy_class_counts': summary['numpy_class_counts'],
              'cutoff_hex_class_counts': summary['cutoff_hex_class_counts'],
              'reproduced_original_bifurcation': summary['reproduced_original_bifurcation'],
              'novel_selection_count': summary['novel_selection_count'],
              'source_symmetric_difference': summary['source_symmetric_difference'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload durable forensic summary
        uses: actions/upload-artifact@v4
        with:
          name: atolia-v3-phase07-hydro-cutoff-forensics-summary
          path: /tmp/phase07_hydro_forensics_summary.json
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
